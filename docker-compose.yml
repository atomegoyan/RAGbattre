services:
  ragbattre:
    build: .
    ports:
      - "8501:8501"
    volumes:
      # Mount data directory from host
      - ./data:/app/data
      # Mount HuggingFace cache from host system  
      - /home/wac/.cache/huggingface:/home/appuser/.cache/huggingface
    environment:
      # Tell HuggingFace to use the mounted cache
      - HF_HOME=/home/appuser/.cache/huggingface
      - TRANSFORMERS_CACHE=/home/appuser/.cache/huggingface
      # Streamlit config
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - PYTHONPATH=/app
    restart: unless-stopped
    user: "1000:1000"